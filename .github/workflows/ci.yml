name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Validate committed release
        run: |
          MONTH=$(python3 -c "import json; print(json.load(open('deploy-manifest.json'))['month'])")
          BEAUTY_MONTHLY_MONTH="$MONTH" ./build/check.sh
