name: Manual Validate and Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: beauty-weekly-pages
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Validate committed monthly release
        run: |
          MONTH=$(python3 -c "import json; print(json.load(open('deploy-manifest.json'))['month'])")
          BEAUTY_MONTHLY_MONTH="$MONTH" ./build/check.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy committed site
        id: deployment
        uses: actions/deploy-pages@v4
